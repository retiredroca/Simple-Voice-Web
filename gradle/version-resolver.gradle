// Multi-version tooling: dependency auto-resolver and port helper.
//
//   ./gradlew newVersion         -Pnew=<mc> [-Pfrom=<mc>]
//   ./gradlew updateVersionProps -Pnew=<mc>
//   ./gradlew portChangedFiles   -Pfrom=<mc> -Pto=<mc> [-Psince=<ref>]
//
// `newVersion` copies versions/<from> (default 1.21.1) to versions/<new>, then resolves the
// Minecraft-matched Fabric Loader / Fabric API / NeoForge versions and writes the new
// version.properties. `updateVersionProps` re-resolves an existing version. Network is only used
// here, never during a normal build.

import groovy.json.JsonSlurper

def httpText = { String url ->
    try {
        def conn = new URL(url).openConnection()
        conn.connectTimeout = 15000
        conn.readTimeout = 15000
        conn.setRequestProperty('User-Agent', 'multiversion-mod-template')
        return conn.inputStream.getText('UTF-8')
    } catch (Exception ignored) {
        return null
    }
}

def xmlVersions = { String xml -> (xml =~ /<version>([^<]+)<\/version>/).collect { it[1] } }

// versionKey / compareVersions / maxVersion are defined once in gradle/versions.gradle, which every
// build applies before this script. They are used below to pick the newest published version of a
// dependency; do not define a local copy here.

def mcParts = { String mc -> mc.tokenize('.').collect { it.isInteger() ? it.toInteger() : 0 } }

def javaFor = { String mc ->
    def p = mcParts(mc)
    def major = p.size() > 0 ? p[0] : 1
    def minor = p.size() > 1 ? p[1] : 0
    def patch = p.size() > 2 ? p[2] : 0
    if (major >= 26) return '25'
    if (major == 1 && minor >= 21) return '21'
    if (major == 1 && minor == 20 && patch >= 5) return '21'
    if (major == 1 && minor >= 18) return '17'
    if (major == 1 && minor == 17) return '16'
    return '8'
}

def eraFor = { String mc -> (mcParts(mc)[0] as int) >= 26 ? 'modern' : 'legacy' }

// Minecraft 1.21.1 -> NeoForge line "21.1";  26.1 -> "26.1".
def neoLine = { String mc ->
    def p = mcParts(mc)
    if (p.size() > 0 && p[0] == 1) {
        return "${p[1]}.${p.size() > 2 ? p[2] : 0}"
    }
    return "${p[0]}.${p.size() > 1 ? p[1] : 0}"
}

def resolvePins = { String mc ->
    def pins = [:]
    pins.minecraft_version = mc
    pins.java_version = javaFor(mc)
    pins.toolchain_era = eraFor(mc)

    def loaderJson = httpText('https://meta.fabricmc.net/v2/versions/loader')
    if (loaderJson) {
        def rows = new JsonSlurper().parseText(loaderJson)
        def stable = rows.find { it.stable } ?: rows[0]
        pins.loader_version = stable.version ?: 'TODO'
    } else {
        pins.loader_version = 'TODO'
    }

    def fabricXml = httpText('https://maven.fabricmc.net/net/fabricmc/fabric-api/fabric-api/maven-metadata.xml')
    def fabric = fabricXml ? maxVersion(xmlVersions(fabricXml).findAll { it.endsWith("+${mc}") }) : null
    pins.fabric_version = fabric ?: 'TODO'

    def neoXml = httpText('https://maven.neoforged.net/releases/net/neoforged/neoforge/maven-metadata.xml')
    def neo = neoXml ? maxVersion(xmlVersions(neoXml).findAll { it.startsWith(neoLine(mc) + '.') }) : null
    pins.neo_version = neo ?: 'TODO'
    pins.neo_version_range = neo ? "[${neo},)" : 'TODO'

    return pins
}

def writeVersionProps = { File versionDir, String mc ->
    def pins = resolvePins(mc)
    def sb = new StringBuilder()
    sb << "# Per-version Minecraft + toolchain pins for versions/${mc}.\n"
    sb << "# Generated by ./gradlew newVersion / updateVersionProps on ${new Date()}.\n"
    sb << "# Canonical source for this version's Minecraft/loader/toolchain values; the loader\n"
    sb << "# builds read it via gradle/versions.gradle.\n"
    sb << "minecraft_version=${pins.minecraft_version}\n"
    sb << "java_version=${pins.java_version}\n"
    sb << "toolchain_era=${pins.toolchain_era}\n"
    sb << "\n"
    sb << "loader_version=${pins.loader_version}\n"
    sb << "fabric_version=${pins.fabric_version}\n"
    sb << "\n"
    sb << "neo_version=${pins.neo_version}\n"
    sb << "neo_version_range=${pins.neo_version_range}\n"
    new File(versionDir, 'version.properties').text = sb.toString()
    return pins
}

def reportPins = { String label, Map pins ->
    logger.lifecycle("${label}:")
    pins.each { k, v -> logger.lifecycle("  ${k}=${v}") }
    if (pins.values().any { it == 'TODO' }) {
        logger.warn('Some pins could not be resolved (marked TODO) — edit version.properties manually.')
    }
}

tasks.register('newVersion') {
    group = 'version'
    description = 'Create versions/<new> by copying versions/<from> and resolving its Minecraft/toolchain pins.'
    doLast {
        def target = project.findProperty('new')
        if (target == null) {
            throw new GradleException('Usage: ./gradlew newVersion -Pnew=<mc> [-Pfrom=<mc>]')
        }
        def from = project.findProperty('from') ?: '1.21.1'
        def src = file("versions/${from}")
        def dst = file("versions/${target}")
        if (!src.exists()) {
            throw new GradleException("Source version versions/${from} not found")
        }
        if (dst.exists()) {
            throw new GradleException("versions/${target} already exists")
        }
        copy {
            from(src)
            into(dst)
            exclude 'build', 'build/**', '.gradle', '.gradle/**', 'run', 'run/**'
        }
        def pins = writeVersionProps(dst, target)
        reportPins("Created versions/${target} from versions/${from}", pins)
        logger.lifecycle("Next: ./gradlew -Pmc=${target} build")
    }
}

tasks.register('updateVersionProps') {
    group = 'version'
    description = 'Re-resolve and rewrite versions/<new>/version.properties.'
    doLast {
        def target = project.findProperty('new')
        if (target == null) {
            throw new GradleException('Usage: ./gradlew updateVersionProps -Pnew=<mc>')
        }
        def dir = file("versions/${target}")
        if (!dir.exists()) {
            throw new GradleException("versions/${target} not found")
        }
        def pins = writeVersionProps(dir, target)
        reportPins("Updated versions/${target}/version.properties", pins)
    }
}

tasks.register('portChangedFiles') {
    group = 'version'
    description = 'Copy files changed under versions/<from> since a git ref into versions/<to> (then fix API differences).'
    doLast {
        def from = project.findProperty('from')
        def to = project.findProperty('to')
        if (from == null || to == null) {
            throw new GradleException('Usage: ./gradlew portChangedFiles -Pfrom=<mc> -Pto=<mc> [-Psince=<ref>]')
        }
        def since = project.findProperty('since') ?: 'HEAD~1'
        def prefix = "versions/${from}/"
        def out = new ByteArrayOutputStream()
        exec {
            commandLine 'git', 'diff', '--name-only', '--diff-filter=ACMR', since, '--', "versions/${from}"
            standardOutput = out
            ignoreExitValue = true
        }
        def files = out.toString('UTF-8').readLines().findAll { it.startsWith(prefix) }
        if (files.isEmpty()) {
            logger.lifecycle("portChangedFiles: no changes under ${prefix} since ${since}")
            return
        }
        files.each { f ->
            def rel = f.substring(prefix.length())
            copy {
                from file(f)
                into new File(file("versions/${to}"), rel).parentFile
            }
        }
        logger.lifecycle("portChangedFiles: copied ${files.size()} file(s) from versions/${from} to versions/${to} (fix any API differences).")
    }
}
