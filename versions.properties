# Per-module versions. Bump the module you are releasing; the release workflow also updates these.
# The key must match the module's `id` in versions/<mc>/<module>/module.properties.
simplevoiceweb=1.0.0.26102020

# Project abbreviation, prepended to every release jar name (see jarFileName in
# gradle/versions.gradle) so jars from different projects cannot collide side by side.
# create-project prompts for it; blank for a single-module project (its own name is unique).
abbrev=svcweb
