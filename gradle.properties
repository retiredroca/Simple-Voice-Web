# Build/JVM settings for this project. These belong in this file only.
#
# org.gradle.jvmargs is read from a build's OWN root directory: a nested gradle.properties (for
# example versions/<mc>/<module>/neoforge/gradle.properties) is ignored when the module is built as
# part of the composite build, and only applies if that directory is built directly with -p. If two
# roots disagree, Gradle starts a second daemon with the smaller heap. Keep them identical if you
# set them per module.
#
# 4G suits a modest machine. Large builds can want more: raise to 6-12G, and consider
# org.gradle.workers.max if you have many cores (each worker is its own JVM, so keep it below the
# core count rather than growing the daemon heap).
org.gradle.jvmargs=-Xmx4G

# The per-loader builds are largely independent, so the build phase parallelises well.
# The build cache makes repeat builds and CI runs much faster.
org.gradle.parallel=true
org.gradle.caching=true

# Default Minecraft version to build (directory under versions/). Override with -Pmc=<version>.
mc=1.21.1
