name: Release Mod (reusable)

on:
  workflow_call:
    inputs:
      release_tag:
        description: 'Release tag whose jars to publish (the GitHub release made locally).'
        required: false
        type: string
        default: ''
      minecraft:
        description: 'Minecraft version (folder under versions/)'
        required: false
        type: string
        default: '1.21.1'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          # The released tag, so versions.properties and the changelog match the jars being published.
          ref: ${{ inputs.release_tag }}
          # History + tags so the changelog can list recent commits and diff versions.properties.
          fetch-depth: 0

      # Read the selected Minecraft version's pins (bash only); the Java version feeds the CF
      # metadata.
      - name: Resolve version pins
        run: |
          set -euo pipefail
          mc='${{ inputs.minecraft }}'
          props="versions/${mc}/version.properties"
          if [ ! -f "$props" ]; then
            echo "No such Minecraft version: $props" >&2
            exit 1
          fi
          java_ver=$(grep -E '^java_version=' "$props" | head -1 | cut -d= -f2 | tr -d '\r')
          {
            echo "MC_VERSION=$mc"
            echo "JAVA_VERSION=${java_ver:-21}"
          } >> "$GITHUB_ENV"
          echo "Minecraft ${mc} (Java ${java_ver:-21})"

      # Make the provider scripts executable.
      - name: Prepare
        run: |
          chmod +x .github/scripts/*.sh

      # The jars come from the GitHub release the local run made.
      - name: Download release assets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          rm -rf "dist/${MC_VERSION}"
          mkdir -p "dist/${MC_VERSION}"
          gh release download '${{ inputs.release_tag }}' --dir "dist/${MC_VERSION}" --pattern '*.jar' --clobber
          ls -la "dist/${MC_VERSION}"
          # mc-publish defaults its `files` glob to build/libs/*.jar, so stage the downloaded
          # release jars there too.
          mkdir -p build/libs
          # Only the mod jars: a sources jar is not a platform artifact, and mc-publish's
          # default `files` glob over build/libs would pick one up. A sources jar carries the
          # Minecraft suffix as well (...-fabric-sources-<mc>.jar), so both shapes are skipped.
          for jar in "dist/${MC_VERSION}"/*.jar; do
            case "$jar" in *-sources.jar|*-sources-*.jar) continue ;; esac
            cp "$jar" build/libs/
          done

      # Safety net: only the expected release jars may be published, and all of them must be there.
      # The count is computed from the project's own modules, never hardcoded. `allowed=` is the same
      # shape the build writes -- <id>-<version>-<loader>.jar, dashes allowed in the id so a `bundle-`
      # prefix matches -- so a stale jar from an earlier naming scheme fails here instead of shipping.
      - name: Verify release jar set
        run: |
          set -euo pipefail
          expected=$(python3 -c "
          import sys
          sys.path.insert(0, 'tools')
          import release
          print(release.expected_jars('${MC_VERSION}'))
          ")
          allowed='^[A-Za-z0-9_-]+-[0-9][0-9.]*-(fabric|neoforge|universal)(-sources)?-[0-9][0-9.]*\.jar$'
          bad=$(ls -1 "dist/${MC_VERSION}" | grep -vE "$allowed" || true)
          if [ -n "$bad" ]; then
            echo "Unexpected file(s) in dist/${MC_VERSION}/ (refusing to publish):" >&2
            echo "$bad" >&2
            exit 1
          fi
          count=$(ls -1 "dist/${MC_VERSION}"/*.jar | wc -l)
          if [ "$count" -ne "$expected" ]; then
            echo "Expected ${expected} release jars, found ${count}:" >&2
            ls -la "dist/${MC_VERSION}" >&2
            exit 1
          fi
          echo "Release jar set OK ($count files)"

      # Read the versions from the released commit and infer whether the component changed by
      # diffing versions.properties against the previous tag.
      - name: Resolve released versions + changed components
        env:
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import os, re, subprocess, sys
          sys.path.insert(0, 'tools')
          import versioning

          tag = os.environ['RELEASE_TAG']
          mc = os.environ['MC_VERSION']
          text = (versioning.ROOT / 'versions.properties').read_text(encoding='utf-8')
          versions = {}
          for line in text.splitlines():
              if '=' in line and not line.lstrip().startswith('#'):
                  k, _, v = line.partition('=')
                  versions[k.strip()] = v.strip()
          abbrev = versions.pop('abbrev', '').strip()   # project setting, not a module

          def git(*args):
              return subprocess.run(['git', *args], capture_output=True, text=True).stdout

          prev = git('describe', '--tags', '--abbrev=0', '--match', f'v*-{mc}', f'{tag}^').strip()
          if not prev:
              print(f'No previous tag for Minecraft {mc}; treating the component as changed.')
              changed = set(versions)
          else:
              print(f'Diffing versions.properties: {prev}..{tag}')
              diff = git('diff', prev, tag, '--', 'versions.properties')
              print(diff)
              changed = {c for c in versions if re.search(rf'^[-+]{re.escape(c)}=', diff, re.M)}

          primary = next(iter(versions))
          with open(os.environ['GITHUB_ENV'], 'a', encoding='utf-8') as env:
              for comp, value in versions.items():
                  env.write(f"{comp.upper()}_VERSION={value}\n")
                  env.write(f"{comp.upper()}_CHANGED={'true' if comp in changed else 'false'}\n")
              env.write(f'PRIMARY={primary}\n')
              env.write(f'PRIMARY_VERSION={versions[primary]}\n')
              # The platform steps below gate on PRIMARY_CHANGED, so derive it from the primary's own
              # flag rather than re-testing membership in `changed`: the two cannot then disagree.
              env.write(f"PRIMARY_CHANGED={'true' if primary in changed else 'false'}\n")
              env.write('MODULE_IDS=' + ','.join(versions) + '\n')
              env.write(f'ABBREV={abbrev}\n')
              # The abbreviation with its trailing hyphen, so an mc-publish glob cannot gain a
              # leading '-' when the project has no abbreviation. release.py's jar_name builds the
              # same prefix, so the glob and the built name cannot drift apart.
              env.write(f"ABBREV_PREFIX={abbrev + '-' if abbrev else ''}\n")
              env.write(f'RELEASE_TAG={tag}\n')
          PY

      # The platform changelog: the last 3 commits, then a link to the full release notes.
      - name: Generate changelog
        run: |
          set -euo pipefail
          {
            git log -3 --no-merges --pretty=format:'- %s (`%h`)'
            echo
            echo
            echo "Full changelog: https://github.com/${{ github.repository }}/releases/tag/${RELEASE_TAG}"
          } > "dist/${MC_VERSION}/changelog.md"
          cat "dist/${MC_VERSION}/changelog.md"

      # --- CurseForge: one entry per release, with the universal jar ---------------------------
      - name: CurseForge
        if: ${{ env.PRIMARY_CHANGED == 'true' }}
        uses: Kir-Antipov/mc-publish@v3.3
        with:
          curseforge-id: ${{ vars.CURSEFORGE_ID }}
          curseforge-token: ${{ secrets.CURSEFORGE_API_KEY }}
          curseforge-files: dist/${{ env.MC_VERSION }}/${{ env.ABBREV_PREFIX }}${{ env.PRIMARY }}-${{ env.PRIMARY_VERSION }}-universal-${{ env.MC_VERSION }}.jar
          curseforge-dependencies: fabric-api(required){modrinth:P7dR8mSH}{curseforge:306612}
          name: ${{ env.PRIMARY }} ${{ env.PRIMARY_VERSION }}-${{ env.MC_VERSION }}
          version: ${{ env.PRIMARY }}-${{ env.PRIMARY_VERSION }}-${{ env.MC_VERSION }}
          changelog-file: dist/${{ env.MC_VERSION }}/changelog.md
          version-type: release
          game-versions: ${{ env.MC_VERSION }}
          loaders: |
            fabric
            neoforge
          java: ${{ env.JAVA_VERSION }}
          retry-attempts: 5
          retry-delay: 15000
          fail-mode: fail

      # --- Modrinth (one project; the previous version is archived) ----------------------------
      - name: Modrinth
        if: ${{ vars.PUBLISH_MODRINTH == 'true' && env.PRIMARY_CHANGED == 'true' }}
        env:
          MODRINTH_TOKEN: ${{ secrets.MODRINTH_TOKEN }}
          MODRINTH_GAME_VERSIONS: ${{ env.MC_VERSION }}
          MODRINTH_ID: ${{ vars.MODRINTH_ID }}
        run: |
          set -euo pipefail
          A="${ABBREV:+${ABBREV}-}"   # project abbreviation, prepended to every release jar name
          ./.github/scripts/modrinth-sync.sh \
            "${MODRINTH_ID}" \
            "mr.${PRIMARY}.version.${MC_VERSION}" "${PRIMARY_VERSION}-${MC_VERSION}" "${PRIMARY} ${PRIMARY_VERSION}-${MC_VERSION}" \
            "dist/${MC_VERSION}/${A}${PRIMARY}-${PRIMARY_VERSION}-universal-${MC_VERSION}.jar"

      # --- Persist the bumped version / learned Modrinth id back to main -----------------------
      - name: Commit version + release state
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'

          if git diff --quiet -- versions.properties release-state.properties; then
            echo "No version/state changes to commit."
            exit 0
          fi

          git stash push -- versions.properties release-state.properties
          git fetch origin main
          git checkout -B main origin/main
          git stash pop
          git add versions.properties release-state.properties
          git commit -m "Release ${{ env.RELEASE_TAG }}: update release state"
          git push origin main
