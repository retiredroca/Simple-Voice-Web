name: Publish Release to Platforms

# Publishes an existing GitHub release's jars to CurseForge/Modrinth (no build). The `release:
# published` event is the normal trigger: the tag workflow builds the jars, attaches them to a
# draft release, and publishes it only when the asset set is complete. A manual dispatch can
# republish an existing release.
on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag to (re)publish (leading "v" optional). Leave blank for the latest release.'
        required: false
      minecraft:
        description: 'Minecraft version; only needed for tags without a -<mc> suffix'
        default: '1.21.1'

permissions:
  contents: write

jobs:
  # Resolves the tag so a manual run can be started with no input at all: the latest release is used
  # when the field is left blank, and the leading "v" is added if it was omitted.
  resolve:
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.tag.outputs.tag }}
      mc: ${{ steps.tag.outputs.mc }}
    steps:
      - id: tag
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          tag='${{ github.event.release.tag_name || github.event.inputs.tag }}'
          if [ -z "$tag" ]; then
            tag=$(gh release list --repo '${{ github.repository }}' --limit 1 --json tagName --jq '.[0].tagName')
            if [ -z "$tag" ]; then
              echo "No release found to publish." >&2
              exit 1
            fi
            echo "No tag given; using the latest release: $tag"
          fi
          case "$tag" in
            v*) ;;
            *) tag="v$tag" ;;
          esac
          mc=''
          case "$tag" in
            *-*) mc="${tag##*-}" ;;
          esac
          if [ -z "$mc" ]; then
            mc='${{ github.event.inputs.minecraft }}'
          fi
          if [ -z "$mc" ]; then
            echo "Tag $tag has no Minecraft suffix and no minecraft input was given." >&2
            exit 1
          fi
          case "$mc" in
            *[!A-Za-z0-9._-]*) echo "Invalid Minecraft version from tag: $mc" >&2; exit 1 ;;
          esac
          echo "Publishing $tag for Minecraft $mc"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "mc=$mc" >> "$GITHUB_OUTPUT"

  publish:
    needs: resolve
    uses: ./.github/workflows/release-mod.yml
    with:
      release_tag: ${{ needs.resolve.outputs.tag }}
      minecraft: ${{ needs.resolve.outputs.mc }}
    secrets: inherit
