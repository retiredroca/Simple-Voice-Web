plugins {
    id 'java-library'
    id 'maven-publish'
    id 'net.neoforged.moddev' version '2.0.148'
}

tasks.named('wrapper', Wrapper).configure {
    distributionType = Wrapper.DistributionType.BIN
}

def repoRoot = projectDir
while (repoRoot != null && !new File(repoRoot, 'gradle/versions.gradle').exists()) {
    repoRoot = repoRoot.parentFile
}
apply from: new File(repoRoot, 'gradle/versions.gradle')

version = mod_version
group = mod_group_id

sourceSets.main.resources {
    // Resources generated by data generators.
    srcDir('src/generated/resources')
    exclude("**/*.bbmodel")
    exclude("src/generated/**/.cache")
}

// See the Fabric build for why the shared sources are relocated into a loader-specific package: it
// lets a single merged jar contain both the Fabric and NeoForge mapping variants.
def commonPrefix = mod_group_id
def relocatedPrefix = "${mod_group_id}.neoforge.common"

tasks.register('relocateCommonSources', Copy) {
    from(rootProject.file('../common/src/main/java'))
    into(layout.buildDirectory.dir('generated/common'))
    filter { String line ->
        line.replace(commonPrefix, relocatedPrefix)
    }
}

tasks.register('relocateLoaderSources', Copy) {
    from('src/main/java')
    into(layout.buildDirectory.dir('generated/loader'))
    filter { String line ->
        def matcher = line =~ /import ${java.util.regex.Pattern.quote(commonPrefix)}\.(?!fabric\b|neoforge\b|mixin\b)([A-Za-z0-9_.]+);/
        if (matcher.find()) {
            return "import ${relocatedPrefix}.${matcher.group(1)};"
        }
        return line
    }
}

sourceSets {
    main {
        java {
            srcDirs = []
            srcDir(tasks.named('relocateCommonSources'))
            srcDir(tasks.named('relocateLoaderSources'))
        }
        resources {
            // Shared assets/data live once in ../common; only loader metadata stays per-loader.
            srcDir(rootProject.file('../common/src/main/resources'))
        }
    }
}

base {
    // The jar is named <mod-id>-<version>-neoforge.jar (see jarFileName in gradle/versions.gradle), so
    // archivesName is the bare mod id and the loader is the trailing element of the file name. NeoForge's userdev
    // plugin has its jar task emit the final mod jar, so jar alone is enough here (no remapJar).
    archivesName = mod_id
}
// Name the file, do NOT use archiveClassifier. A classifier is part of the published maven
// identity, so it lands in repo/ as <artifactId>-<version>-neoforge.jar and every host module
// fails to resolve the library - the classes are inside the jar, Loom looks for the
// unclassified name. archiveFileName renames the file and leaves the classifier empty, so the
// coordinate is untouched. Verified: remapJar does write to this name, and what lands there
// is the remapped jar (the jar task's output goes to build/devlibs).
tasks.named('jar') { archiveFileName = jarFileName(mod_id, mod_version, 'neoforge') }

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(java_version)
    }
    withSourcesJar()
}

// The sources jar is a release-shaped artifact too, so it takes the same name as the others -- with
// the project abbreviation. Without this it keeps the bare archivesName, which is neither
// standardized nor what the keep-set below expects. It is what the release stages alongside the mod
// jar, so a release carries the sources for both loaders and not just for Fabric.
tasks.named('sourcesJar') { archiveFileName = jarFileName(mod_id, mod_version, 'sources') }

// Modern NeoForge uses ModDevGradle: it supplies the NeoForge dependency and run tasks.
neoForge {
    version = "${neo_version}"
}

repositories {
    maven {
        name = 'MaxHenkel'
        url = 'https://maven.maxhenkel.de/repository/public'
    }
}

dependencies {
    // See the Fabric build: compile against the 2.6.0 API floor and let voice chat supply it.
    compileOnly "de.maxhenkel.voicechat:voicechat-api:${voicechat_api_version}"
}

tasks.withType(ProcessResources).configureEach {
    var replaceProperties = [
            minecraft_version      : minecraft_version,
            neo_version            : neo_version,
            loader_version_range   : '[1,)',
            mod_id                 : mod_id,
            mod_name               : mod_name,
            mod_license            : mod_license,
            mod_version            : mod_version,
            voicechat_api_version  : voicechat_api_version,
    ]
    inputs.properties replaceProperties
    filesMatching(['META-INF/neoforge.mods.toml']) {
        expand replaceProperties
    }
}

// Library modules (module.properties library=true) are published to the in-repo maven so other
// modules can depend on them. The repository has to exist here, or the
// publishMavenJavaPublicationToRepoRepository task the root build and tools/release.py reference
// would not be created.
if (mod_library) {
    publishing {
        publications {
            register('mavenJava', MavenPublication) {
                from components.java
                artifactId = "${mod_id}-neoforge-${targetMc}"
            }
        }
        repositories {
            maven {
                name = 'repo'
                url = uri("${repoRoot}/repo")
            }
        }
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}

// Keep build/libs to this build's jars only: drop any kept from earlier version stamps. Without
// this the directory accumulates every version ever built, and a version-pinned root lookup that
// still pointed at an old name would resolve a stale jar while the build reports success.
// .toString() on the sources entry is required: a GString never equals the String that File.name
// returns, so a keep-set built from a closure would match nothing and delete the jar just built.
tasks.named('build') {
    doLast {
        def libs = layout.buildDirectory.dir('libs').get().asFile
        if (!libs.isDirectory()) {
            return
        }
        def keep = [jarFileName(mod_id, mod_version, 'neoforge').toString(),
                    jarFileName(mod_id, mod_version, 'sources').toString()] as Set
        libs.listFiles()?.each { f ->
            if (f.isFile() && f.name.endsWith('.jar') && !keep.contains(f.name)) {
                f.delete()
            }
        }
    }
}
